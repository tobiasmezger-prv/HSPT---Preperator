<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="A 3-row, 5-column square grid. Shaded cells: row 1 columns 1,2; row 2 columns 1,2,3; row 3 columns 3,4."><rect width="480" height="280" fill="white"/><g stroke="#183747" stroke-width="2.5" fill="none"><rect x="100" y="55" width="45" height="45" fill="#c5e8e6"/><rect x="145" y="55" width="45" height="45" fill="#c5e8e6"/><rect x="190" y="55" width="45" height="45" fill="white"/><rect x="235" y="55" width="45" height="45" fill="white"/><rect x="280" y="55" width="45" height="45" fill="white"/><rect x="100" y="100" width="45" height="45" fill="#c5e8e6"/><rect x="145" y="100" width="45" height="45" fill="#c5e8e6"/><rect x="190" y="100" width="45" height="45" fill="#c5e8e6"/><rect x="235" y="100" width="45" height="45" fill="white"/><rect x="280" y="100" width="45" height="45" fill="white"/><rect x="100" y="145" width="45" height="45" fill="white"/><rect x="145" y="145" width="45" height="45" fill="white"/><rect x="190" y="145" width="45" height="45" fill="#c5e8e6"/><rect x="235" y="145" width="45" height="45" fill="#c5e8e6"/><rect x="280" y="145" width="45" height="45" fill="white"/><text x="240" y="220" font-size="20" font-family="Arial" fill="#183747" stroke="none" text-anchor="middle">Each square: 2 cm × 2 cm</text></g></svg>
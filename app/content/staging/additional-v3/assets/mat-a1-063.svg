<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Two parallel horizontal lines crossed by a sloping transversal. The upper exterior left angle is 67 degrees. The angle above the lower line on the right is x."><rect width="480" height="280" fill="white"/><g stroke="#183747" stroke-width="2.5" fill="none"><path d="M50,80 L425,80"/><path d="M50,195 L425,195"/><path d="M145,35 L295,240"/><text x="135" y="65" font-size="20" font-family="Arial" fill="#183747" stroke="none" text-anchor="middle">67°</text><text x="305" y="180" font-size="20" font-family="Arial" fill="#183747" stroke="none" text-anchor="middle">x°</text><text x="355" y="130" font-size="20" font-family="Arial" fill="#183747" stroke="none" text-anchor="middle">Lines are parallel</text></g></svg>